name: Deploy Storybook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Publish Package']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-storybook
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve-release:
    name: Find latest release tag
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.find.outputs.tag }}
      release-sha: ${{ steps.find.outputs.sha }}
      has-release: ${{ steps.find.outputs.has-release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Find latest release tag
        id: find
        run: |
          tag=$(git tag --list 'nxtcm-dashboard-v*' --list 'nxtcm-rosa-hcp-wizard-v*' \
            --sort=-creatordate | head -n1)

          if [ -z "$tag" ]; then
            echo "No release tags found — root will be built from main"
            echo "has-release=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
          else
            sha=$(git rev-parse "$tag")
            echo "Latest release tag: $tag ($sha)"
            echo "has-release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          fi

  build-release:
    name: 'Build root (/)'
    needs: resolve-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: >-
            ${{
              needs.resolve-release.outputs.has-release == 'true'
                && needs.resolve-release.outputs.release-sha
                || ''
            }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - run: npm ci

      - name: Resolve package versions
        id: versions
        run: |
          echo "dashboard=$(node -p "require('./packages/nxtcm-dashboard/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "wizard=$(node -p "require('./packages/nxtcm-rosa-hcp-wizard/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build Storybook (release)
        run: npm run build-storybook
        env:
          STORYBOOK_BASE_PATH: /nxtcm-components/
          STORYBOOK_DEPLOYMENT_TYPE: release
          STORYBOOK_DASHBOARD_VERSION: ${{ steps.versions.outputs.dashboard }}
          STORYBOOK_WIZARD_VERSION: ${{ steps.versions.outputs.wizard }}
          STORYBOOK_COMMIT_SHA: ${{ needs.resolve-release.outputs.release-sha || github.sha }}

      - name: Write metadata
        run: node scripts/write-storybook-metadata.mjs storybook-static
        env:
          STORYBOOK_DEPLOYMENT_TYPE: release
          STORYBOOK_COMMIT_SHA: ${{ needs.resolve-release.outputs.release-sha || github.sha }}

      - name: Assert public Storybook index
        run: npm run storybook:assert-public

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-release
          path: storybook-static/
          retention-days: 7

  build-preview:
    name: 'Build preview (/next/)'
    needs: resolve-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || '' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - run: npm ci

      - name: Resolve package versions
        id: versions
        run: |
          echo "dashboard=$(node -p "require('./packages/nxtcm-dashboard/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "wizard=$(node -p "require('./packages/nxtcm-rosa-hcp-wizard/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build Storybook (preview)
        run: npm run build-storybook
        env:
          STORYBOOK_BASE_PATH: /nxtcm-components/next/
          STORYBOOK_DEPLOYMENT_TYPE: preview
          STORYBOOK_DASHBOARD_VERSION: ${{ steps.versions.outputs.dashboard }}
          STORYBOOK_WIZARD_VERSION: ${{ steps.versions.outputs.wizard }}
          STORYBOOK_COMMIT_SHA: ${{ github.sha }}

      - name: Write metadata
        run: node scripts/write-storybook-metadata.mjs storybook-static
        env:
          STORYBOOK_DEPLOYMENT_TYPE: preview
          STORYBOOK_COMMIT_SHA: ${{ github.sha }}

      - name: Assert public Storybook index
        run: npm run storybook:assert-public

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-preview
          path: storybook-static/
          retention-days: 7

  deploy:
    name: Deploy combined site
    needs: [build-release, build-preview]
    if: github.repository == 'RedHatInsights/nxtcm-components'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Create combined site directory
        run: mkdir -p site/next

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: storybook-release
          path: site/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: storybook-preview
          path: site/next/

      - name: Verify combined site structure
        run: |
          echo "=== Root files ==="
          ls -la site/index.html site/index.json site/storybook-metadata.json
          echo "=== Preview files ==="
          ls -la site/next/index.html site/next/index.json site/next/storybook-metadata.json
          echo "=== Root metadata ==="
          cat site/storybook-metadata.json
          echo "=== Preview metadata ==="
          cat site/next/storybook-metadata.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
