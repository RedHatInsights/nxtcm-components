name: CT Triage Comment

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    name: Post CT triage comment
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # security boundary: only checkout trusted default-branch files for this workflow.
          # never checkout PR head content in this privileged workflow_run job.
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            utils/ct-triage-comment.mjs
            package.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'

      - name: Find PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          REPO="${{ github.repository }}"

          # works for same-repo branches
          PR=$(gh api "repos/${REPO}/commits/${SHA}/pulls" --jq '.[0].number // empty' 2>/dev/null || echo "")

          # fallback for fork PRs: commits API can't resolve fork SHAs,
          # so search open PRs by head SHA instead
          if [ -z "$PR" ]; then
            PR=$(gh pr list --repo "$REPO" --state open --limit 200 --json number,headRefOid \
              --jq ".[] | select(.headRefOid == \"${SHA}\") | .number" | head -1)
          fi

          echo "number=${PR}" >> "$GITHUB_OUTPUT"

      - name: Download CT summary artifact
        if: steps.pr.outputs.number
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: playwright-ct-report
          path: ct-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post triage comment
        if: steps.pr.outputs.number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUMMARY="ct-report/test-results/playwright-ct-summary.json"
          if [ ! -f "$SUMMARY" ]; then
            echo "No summary JSON found, skipping"
            exit 0
          fi
          BODY=$(node utils/ct-triage-comment.mjs --summary-json "$SUMMARY")
          if [ -n "$BODY" ]; then
            gh pr comment "${{ steps.pr.outputs.number }}" --body "$BODY"
          fi
