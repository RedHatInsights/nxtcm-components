name: Check Links and Send Failures to Slack

on:
  workflow_dispatch:
  schedule:
    - cron: "45 11 * * MON"
permissions:
  contents: read
jobs:
  check-links-and-send-failures-to-slack:
    name: Check Links and Send Failures to Slack
    runs-on: ubuntu-latest
   
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
      - name: Find and list broken links
        id: check-links
        run: node utils/check-links.mjs

      - name: Send message to Slack
        if: steps.check-links.outputs.has404 == 'true'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_BROKEN_LINKS_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          payload: |
            has404: "${{ steps.check-links.outputs.has404 }}"
            404_length: "${{ steps.check-links.outputs.notFoundLength }}"
            message: "Broken links found"
            run_url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"