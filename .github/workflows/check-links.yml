name: Check Links and Send Failures to Slack

on:
  workflow_dispatch:
  schedule:
    - cron: '45 11 * * MON'
permissions:
  contents: read
jobs:
  check-links-and-send-failures-to-slack:
    name: Check Links and Send Failures to Slack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        id: setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - name: Install dependencies
        id: install
        shell: bash
        run: npm ci 2>&1 | tee "$RUNNER_TEMP/ci-command.log"

      - name: Find and list broken links
        id: check-links
        shell: bash
        run: node utils/check-links.mjs 2>&1 | tee "$RUNNER_TEMP/ci-command.log"

      - name: Send message to Slack
        if: steps.check-links.outputs.has404 == 'true'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_BROKEN_LINKS_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          payload: |
            has404: "${{ steps.check-links.outputs.has404 }}"
            404_length: "${{ steps.check-links.outputs.notFoundLength }}"
            message: "Broken links found"
            run_url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Prepare CI failure notification
        id: prepare-failure
        if: failure()
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SETUP_NODE_OUTCOME: ${{ steps.setup-node.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          CHECK_OUTCOME: ${{ steps.check-links.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$CHECKOUT_OUTCOME" == "failure" ]]; then
            failed_step="Checkout repository"
          elif [[ "$SETUP_NODE_OUTCOME" == "failure" ]]; then
            failed_step="Set up Node.js"
          elif [[ "$INSTALL_OUTCOME" == "failure" ]]; then
            failed_step="Install dependencies"
          elif [[ "$CHECK_OUTCOME" == "failure" ]]; then
            failed_step="Find and list broken links"
          else
            failed_step="Another workflow step; see the run logs"
          fi

          details="See the GitHub Actions run for details."
          if [[ "$INSTALL_OUTCOME" == "failure" || "$CHECK_OUTCOME" == "failure" ]]; then
            if [[ -f "$RUNNER_TEMP/ci-command.log" ]]; then
              details="$(tail -n 20 "$RUNNER_TEMP/ci-command.log" | tail -c 2500)"
            fi
          fi

          jq -n \
            --arg message "CI failed: $failed_step"$'\n\n'"$details" \
            --arg run_url "$RUN_URL" \
            '{
              has404: "false",
              "404_length": "0",
              message: $message,
              run_url: $run_url
            }' > "$RUNNER_TEMP/slack-failure.json"

      - name: Send CI failure to Slack
        if: failure() && steps.prepare-failure.outcome == 'success'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_BROKEN_LINKS_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          payload-file-path: ${{ runner.temp }}/slack-failure.json
